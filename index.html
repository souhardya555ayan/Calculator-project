<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "total">
     <div class = "heading">
        <h1><b><i><u>Calculator</u></i></b></h1>
        <pre><h4><i>        -by Ayan</i></h4></pre>
     </div>
     <div id="calculator">
        <div id = "mainbody">
            <input id = "display" readonly placeholder="0" >
            <div id = "keys">
                <button class = "AC" onclick = "clearDisplay()">AC</button>
                <button class = "operator" onclick = "appendToDisplay('**')">xʸ</button>
                <button class = "operator" onclick = "percentage()">%</button>
                <button class = "operator" onclick = "appendToDisplay('/')">÷</button>

                <button onclick = "appendToDisplay('7')">7</button>
                <button onclick = "appendToDisplay('8')">8</button>
                <button onclick = "appendToDisplay('9')">9</button>
                <button class = "operator" onclick = "appendToDisplay('*')">x</button>

                <button onclick = "appendToDisplay('4')">4</button>
                <button onclick = "appendToDisplay('5')">5</button>
                <button onclick = "appendToDisplay('6')">6</button>
                <button class = "operator" onclick = "appendToDisplay('-')">-</button>
            
                <button onclick = "appendToDisplay('1')">1</button>
                <button onclick = "appendToDisplay('2')">2</button>
                <button onclick = "appendToDisplay('3')">3</button>
                <button class = "operator" onclick = "appendToDisplay('+')">+</button>
            
                <button onclick = "appendToDisplay('0')">0</button>
                <button onclick = "appendToDisplay('.')">.</button>
                <button onclick = "deleteLast()">&#9003;</button>
                <button class = "equal" onclick = "calculate()">=</button>
            </div>
        </div>
     </div>     
    </div> 
    <script src="app.js"></script>
</body>
</html>
